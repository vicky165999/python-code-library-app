---
version: "3.8"
services:
  db:
    container_name: db
    image: db
    ports:
      - "1111:3306"
    volumes:
      - mydata:/var/lib/mysql/
    networks:
      - mynetwork
    deploy:
      resources:
        reservations:
          cpus: "0.25"
          memory: 100M
        limits:
          cpus: "0.5"
          memory: 200M

  auth_service:
    container_name: auth_service
    image: authimage
    ports:
      - "1112:5001"
    networks:
      - mynetwork
    deploy:
      resources:
        reservations:
          cpus: "0.25"
          memory: 100M
        limits:
          cpus: "0.5"
          memory: 200M
  book_service:
    container_name: book_service
    image: bookimage
    ports:
      - "1113:5002"
    networks:
      - mynetwork
    deploy:
      resources:
        reservations:
          cpus: "0.25"
          memory: 100M
        limits:
          cpus: "0.5"
          memory: 200M
  borrow_service:
    container_name: borrow_service
    image: borrowimage
    ports:
      - "1114:5003"
    networks:
      - mynetwork
    deploy:
      resources:
        reservations:
          cpus: "0.25"
          memory: 100M
        limits:
          cpus: "0.5"
          memory: 200M
  frontend:
    container_name: frontend
    image: appimage
    ports:
      - "1115:5000"
    networks:
      - mynetwork
    deploy:
      resources:
        reservations:
          cpus: "0.25"
          memory: 100M
        limits:
          cpus: "0.5"
          memory: 200M
networks:
  mynetwork:
    driver: overlay
volumes:
  mydata:
